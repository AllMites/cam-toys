<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ascii cam</title>
<style>
  body { margin: 0; background: #000; color: #0f0; display: grid; place-items: center; min-height: 100vh; }
  pre { font: 8px/8px monospace; margin: 0; }
</style>
</head>
<body>
<pre id="out">starting camera…</pre>
<script type="module">
/*
  HOW IT WORKS
  1. Draw the video onto a tiny hidden canvas (about 100 px wide). Fewer pixels = fewer characters.
  2. getImageData() hands us the raw RGBA bytes of that canvas.
  3. Brightness of a pixel = 0.299*R + 0.587*G + 0.114*B (the eye is most sensitive to green).
  4. Map brightness 0..255 to a character "ramp" from empty to dense: ' .:-=+*#%@'.
  5. Characters are about twice as tall as wide, so we sample half as many rows as columns.
  6. Mirror horizontally so it behaves like a mirror.
*/
import { startCamera, showError } from './cam.js';

const COLS = 100;
const RAMP = ' .:-=+*#%@';
const out = document.getElementById('out');

try {
  const video = await startCamera();
  const rows = Math.round((COLS * video.videoHeight) / video.videoWidth / 2);
  const small = document.createElement('canvas');
  small.width = COLS;
  small.height = rows;
  const ctx = small.getContext('2d', { willReadFrequently: true });

  function frame() {
    ctx.drawImage(video, 0, 0, COLS, rows);
    const px = ctx.getImageData(0, 0, COLS, rows).data;
    let text = '';
    for (let y = 0; y < rows; y++) {
      for (let x = COLS - 1; x >= 0; x--) { // right-to-left = mirrored
        const i = (y * COLS + x) * 4;
        const b = 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2];
        text += RAMP[Math.min(RAMP.length - 1, (b / 256 * RAMP.length) | 0)];
      }
      text += '\n';
    }
    out.textContent = text;
    requestAnimationFrame(frame);
  }
  frame();
} catch (e) {
  showError(e.message);
}
</script>
</body>
</html>
