<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>motion</title>
<style>
  body { margin: 0; background: #000; display: grid; place-items: center; min-height: 100vh; color: #888; font: 14px system-ui; }
  canvas { max-width: 100vw; max-height: 100vh; }
  #hint { position: fixed; bottom: 8px; left: 8px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">press T: trails / heatmap · wave at the bubbles</div>
<script type="module">
/*
  HOW IT WORKS (frame differencing)
  1. Shrink each frame to ~160 px wide and make it grayscale. Small = fast and less noisy.
  2. Compare with the previous frame. If a pixel changed by more than THRESH, it "moved".
  3. Trails: paint moved pixels bright onto a layer that fades a little every frame.
  4. Heatmap: same, but colour by how recently the pixel moved.
  5. Bubbles: a bubble pops when enough moved pixels fall inside its circle.
  Limit: this sees change, not objects. Stand perfectly still and you vanish.
*/
import { startCamera, showError, fitCanvas } from './cam.js';

const W = 160;          // analysis width
const THRESH = 30;      // brightness change that counts as motion
const POP_FRACTION = 0.15;
let heat = true;
addEventListener('keydown', (e) => { if (e.key === 't') heat = !heat; });

try {
  const video = await startCamera();
  const H = Math.round((W * video.videoHeight) / video.videoWidth);
  const canvas = document.getElementById('c');
  fitCanvas(canvas, video);
  const ctx = canvas.getContext('2d');

  const small = document.createElement('canvas');
  small.width = W; small.height = H;
  const sctx = small.getContext('2d', { willReadFrequently: true });

  // trail layer at analysis resolution, scaled up when drawn
  const trail = document.createElement('canvas');
  trail.width = W; trail.height = H;
  const tctx = trail.getContext('2d');

  let prev = null;
  const moved = new Uint8Array(W * H);

  const bubbles = Array.from({ length: 10 }, () => ({ x: 0, y: 0, r: 0, alive: false, t: 0 }));
  function spawn(b) {
    b.r = 8 + Math.random() * 8;
    b.x = b.r + Math.random() * (W - 2 * b.r);
    b.y = b.r + Math.random() * (H - 2 * b.r);
    b.alive = true;
  }
  bubbles.forEach(spawn);

  function frame(now) {
    sctx.drawImage(video, 0, 0, W, H);
    const px = sctx.getImageData(0, 0, W, H).data;
    const gray = new Uint8Array(W * H);
    for (let i = 0; i < W * H; i++) {
      gray[i] = 0.299 * px[i * 4] + 0.587 * px[i * 4 + 1] + 0.114 * px[i * 4 + 2];
    }
    moved.fill(0);
    if (prev) { // first frame has nothing to compare with
      for (let i = 0; i < W * H; i++) moved[i] = Math.abs(gray[i] - prev[i]) > THRESH ? 1 : 0;
    }
    prev = gray;

    // fade old trail, add new motion
    tctx.fillStyle = 'rgba(0,0,0,0.12)';
    tctx.fillRect(0, 0, W, H);
    tctx.fillStyle = heat ? '#ff5a1f' : '#ffffff';
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (moved[y * W + x]) tctx.fillRect(x, y, 1, 1);
    }

    // draw mirrored video + trail layer
    ctx.save();
    ctx.translate(canvas.width, 0); ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    ctx.globalAlpha = 0.85;
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(trail, 0, 0, canvas.width, canvas.height);
    ctx.restore();

    // bubbles live in mirrored display space; motion buffer is unmirrored, so flip x when testing
    const sx = canvas.width / W, sy = canvas.height / H;
    for (const b of bubbles) {
      if (!b.alive) { if (now - b.t > 1000) spawn(b); continue; }
      let hit = 0, total = 0;
      const mx = W - b.x; // mirrored x -> buffer x
      for (let y = Math.max(0, b.y - b.r | 0); y < Math.min(H, b.y + b.r); y++) {
        for (let x = Math.max(0, mx - b.r | 0); x < Math.min(W, mx + b.r); x++) {
          if ((x - mx) ** 2 + (y - b.y) ** 2 <= b.r * b.r) { total++; hit += moved[y * W + x]; }
        }
      }
      if (total && hit / total > POP_FRACTION) { b.alive = false; b.t = now; continue; }
      ctx.beginPath();
      ctx.arc(b.x * sx, b.y * sy, b.r * sx, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(120,200,255,.9)'; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = 'rgba(120,200,255,.2)'; ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
} catch (e) {
  showError(e.message);
}
</script>
</body>
</html>
