appId: io.github.allmites.camtoys
productName: cam-toys
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  - resources/** # ?asset files (tray.png, softcam.dll) resolve to ../../resources at runtime
extraResources:
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: LICENSE
    to: LICENSE.txt
asarUnpack:
  - resources/**
  - '**/*.node'
  - '**/*.dll'
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  executableName: cam-toys
nsis:
  oneClick: false
  perMachine: true # Phase 2 needs admin for regsvr32
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: cam-toys
  uninstallDisplayName: cam-toys
  artifactName: ${productName}-Setup-${version}.${ext}
  differentialPackage: false # no .blockmap: updater downloads the full installer; parallel blockmap upload raced to create the release (422)
mac:
  target:
    - target: dmg
      arch: [universal]
    - target: zip # electron-updater on mac needs the zip
      arch: [universal]
  icon: build/icon.png
  category: public.app-category.video
  x64ArchFiles: "**/koffi*/**/*.node" # koffi ships per-arch prebuilds side by side; universal merge must not lipo them
  extendInfo:
    NSCameraUsageDescription: cam-toys needs the camera to apply filters.
  # ponytail: unsigned. Gatekeeper warns on first open; auto-update on mac needs a Developer ID cert + notarization.
  identity: null
dmg:
  artifactName: ${productName}-${version}-mac.${ext}
npmRebuild: false
publish:
  provider: github
  owner: AllMites
  repo: cam-toys
  releaseType: release
