appId: io.github.allmites.camtoys
productName: cam-toys
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  - resources/** # ?asset files (tray.png, softcam.dll) resolve to ../../resources at runtime
extraResources:
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: LICENSE
    to: LICENSE.txt
asarUnpack:
  - resources/**
  - '**/*.node'
  - '**/*.dll'
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  executableName: cam-toys
nsis:
  oneClick: false
  perMachine: true # Phase 2 needs admin for regsvr32
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: cam-toys
  uninstallDisplayName: cam-toys
  artifactName: ${productName}-Setup-${version}.${ext}
  differentialPackage: false # no .blockmap: no auto-update, and two parallel uploads raced to create the release (422)
npmRebuild: false
publish:
  provider: github
  owner: AllMites
  repo: cam-toys
  releaseType: release
