<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>hands</title>
<style>
  body { margin: 0; background: #000; display: grid; place-items: center; min-height: 100vh; color: #888; font: 14px system-ui; }
  canvas { max-width: 100vw; max-height: 100vh; }
  #hint { position: fixed; bottom: 8px; left: 8px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">loading model…</div>
<script type="module">
/*
  HOW IT WORKS
  1. MediaPipe's HandLandmarker is a small neural net. Give it a video frame, it returns 21 landmarks
     per hand. Each is {x, y, z} with x,y NORMALISED to 0..1 (fractions of the frame, not pixels).
     Landmark 4 = thumb tip, 8 = index fingertip.
  2. The image is shown mirrored, so we flip x with (1 - x) to make the dots line up.
  3. Air-draw: while thumb and index are apart, the index tip adds points to the current stroke.
     Pinch them together (distance < PINCH) and the pen lifts; the next open hand starts a new stroke.
  4. We only call the model when the video has a new frame (currentTime changed).
  Keys: C clears the drawing.
*/
import { startCamera, showError, fitCanvas } from './cam.js';
import { HandLandmarker, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';

const PINCH = 0.05;
const CONNECTIONS = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
const hint = document.getElementById('hint');

try {
  const video = await startCamera();
  const canvas = document.getElementById('c');
  fitCanvas(canvas, video);
  const ctx = canvas.getContext('2d');

  const vision = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  const landmarker = await HandLandmarker.createFromOptions(vision, {
    baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task' },
    runningMode: 'VIDEO',
    numHands: 2,
  });
  hint.textContent = 'open hand = draw · pinch = lift pen · C clears';

  let strokes = [[]];
  addEventListener('keydown', (e) => { if (e.key === 'c') strokes = [[]]; });

  let lastTime = -1;
  let hands = [];
  function frame() {
    if (video.currentTime !== lastTime) {
      lastTime = video.currentTime;
      hands = landmarker.detectForVideo(video, performance.now()).landmarks;
    }
    const W = canvas.width, H = canvas.height;
    ctx.save();
    ctx.translate(W, 0); ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0, W, H);
    ctx.restore();

    // strokes (stored already mirrored, in pixels)
    ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.strokeStyle = '#ffcc00';
    for (const s of strokes) {
      if (s.length < 2) continue;
      ctx.beginPath();
      ctx.moveTo(s[0][0], s[0][1]);
      for (const p of s) ctx.lineTo(p[0], p[1]);
      ctx.stroke();
    }

    // no hand: close the stroke and draw nothing else
    if (hands.length === 0) {
      if (strokes[strokes.length - 1].length) strokes.push([]);
    }
    hands.forEach((lm, i) => {
      const P = (l) => [(1 - l.x) * W, l.y * H];
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2;
      for (const [a, b] of CONNECTIONS) {
        const pa = P(lm[a]), pb = P(lm[b]);
        ctx.beginPath(); ctx.moveTo(...pa); ctx.lineTo(...pb); ctx.stroke();
      }
      ctx.fillStyle = '#0ff';
      for (const l of lm) { const [x, y] = P(l); ctx.fillRect(x - 2, y - 2, 4, 4); }

      if (i === 0) { // first hand draws
        const pinching = Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y) < PINCH;
        const cur = strokes[strokes.length - 1];
        if (pinching) { if (cur.length) strokes.push([]); }
        else cur.push(P(lm[8]));
      }
    });
    requestAnimationFrame(frame);
  }
  frame();
} catch (e) {
  showError(e.message);
}
</script>
</body>
</html>
